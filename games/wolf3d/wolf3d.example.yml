# Copy to wolf3d.yml (gitignored) and point it at your own copy of Wolfenstein 3D.
#
# The directory must hold VSWAP, GAMEMAPS, MAPHEAD, VGAGRAPH, VGADICT, VGAHEAD, AUDIOT and
# AUDIOHED. Their extension says which release it is: WL1 shareware, WL6 registered,
# SOD Spear of Destiny, SDM the Spear demo.
#
# Spear usually sits in a sub-directory of the Wolfenstein folder. Point straight at it — the
# directory is read flat, not searched downward.
#
# WOLF3D_DATA in the environment overrides this file.

data: ~/games/wolfenstein-3d
