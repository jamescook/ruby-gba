name: CI

# Manual only for now — no auto-build on push or PR.
# Run from the Actions tab ("Run workflow") or: gh workflow run ci.yml
on:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (ruby ${{ matrix.ruby }})
    runs-on: ubuntu-24.04        # stable, pre-cached Ruby
    strategy:
      fail-fast: false
      matrix:
        ruby: ['4.0']

    steps:
      - uses: actions/checkout@v6

      # Build dependencies: a compiler + libmgba to build gemba-core's C extension
      # (the headless libmgba probe the emulator-backed tests run on), and
      # ImageMagick for ruby-gba's PNG import. gemba-core is headless — no SDL2, Tk,
      # or X11 — so no display server or audio daemon is needed.
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential make pkg-config zlib1g-dev \
            libmgba-dev imagemagick

      # No committed Gemfile.lock → fresh resolve. ruby-gba's deps are pure Ruby
      # (rake, minitest), so bundle install compiles nothing.
      - name: Set up Ruby (+ bundle install)
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true

      # `rake test` builds gemba-core's C extension first (it's required), then runs
      # the suite headless against it.
      - name: Run tests
        run: |
          set -o pipefail
          bundle exec rake test 2>&1 | tee test-output.log
        env:
          CI: '1'

      # gemba-core also has its OWN suite (its C ext + probe, tested in isolation),
      # kept out of the main `rake test` glob — run it separately.
      - name: Test gemba-core itself (headless libmgba probe)
        run: bundle exec rake test:mgba 2>&1 | tee gemba-core-test.log
        env:
          CI: '1'

      - name: Upload test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-log-ruby${{ matrix.ruby }}
          path: |
            test-output.log
            gemba-core-test.log
          retention-days: 7
