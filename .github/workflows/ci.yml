name: CI

# Manual only for now — deliberately NO auto-build on push or PR.
# Run it from the Actions tab ("Run workflow") or: gh workflow run ci.yml
on:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (ruby ${{ matrix.ruby }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        # gemspec allows >= 3.2; gemba's own CI targets 4.0. Add versions for a matrix.
        ruby: ['4.0']

    steps:
      - uses: actions/checkout@v6

      # System libraries gemba's native builds need: teek (Tcl/Tk), teek-sdl2
      # (SDL2), and an embedded mGBA core.
      #
      # gemba's own CI caches apt via Docker/buildkit cache mounts — that only
      # works because it builds inside Docker. This job runs on the runner
      # directly, so we cache the packages with cache-apt-pkgs-action instead:
      # ~2 min cold, a few seconds on a cache hit. Bump `version:` to force a
      # refresh; tweak the list against gemba's Dockerfile.ci-test if a build fails.
      - name: Install gemba build dependencies (cached)
        uses: awalsh128/cache-apt-pkgs-action@v1
        with:
          packages: >-
            build-essential pkg-config cmake
            tcl-dev tk-dev
            libsdl2-dev
            libpng-dev zlib1g-dev libzip-dev
            xvfb
          version: 1

      # Gemfile.lock is intentionally NOT committed, so Bundler resolves fresh
      # each run against the gemspec ranges (no frozen mode, no lockfile checksum
      # issues). bundler-cache still caches the installed gems — including gemba's
      # compiled native extensions — so the expensive C build isn't repeated on a hit.
      - name: Set up Ruby (+ bundle install, which compiles gemba)
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true

      # gemba brings in Tcl/Tk (teek) and SDL2, which expect a display. CI is
      # headless, so run under a virtual framebuffer and point SDL at its dummy
      # drivers. Integration tests still skip gracefully if gemba can't load
      # (see GembaSupport#skip_unless_gemba), so unit tests pass either way.
      - name: Run tests
        run: |
          set -o pipefail
          xvfb-run -a bundle exec rake test 2>&1 | tee test-output.log
        env:
          CI: '1'
          SDL_VIDEODRIVER: dummy
          SDL_AUDIODRIVER: dummy

      - name: Upload test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-log-ruby${{ matrix.ruby }}
          path: test-output.log
          retention-days: 7
