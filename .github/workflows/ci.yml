name: CI

# Manual only for now — no auto-build on push or PR.
# Run from the Actions tab ("Run workflow") or: gh workflow run ci.yml
on:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (ruby ${{ matrix.ruby }})
    runs-on: ubuntu-24.04        # stable + pre-cached Ruby; ships Tcl/Tk 8.6 natively
    strategy:
      fail-fast: false
      matrix:
        ruby: ['4.0']

    steps:
      - uses: actions/checkout@v6

      # gemba's build deps, Tcl-8.6 path from its Dockerfile.ci-test: teek (Tcl/Tk),
      # teek-sdl2 (SDL2 family), gemba (links system libmgba). No pkg-config symlink
      # needed on 8.6, and libtk-img is a normal package here (the Debian fetch was
      # tcl9-only). imagemagick is also used by ruby-gba's PNG import.
      - name: Install gemba dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential make pkg-config \
            libyaml-dev libffi-dev libreadline-dev zlib1g-dev libssl-dev \
            libx11-dev libxcursor-dev \
            libsdl2-dev libsdl2-ttf-dev libsdl2-image-dev libsdl2-mixer-dev libsdl2-gfx-dev \
            libmgba-dev \
            tcl-dev tk-dev libtk-img \
            bwidget xvfb pulseaudio imagemagick ffmpeg

      # No committed Gemfile.lock → fresh resolve (no frozen/checksum issues).
      # bundler-cache caches the compiled teek/gemba extensions across runs.
      - name: Set up Ruby (+ bundle install, which compiles gemba/teek)
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true

      # Headless: PulseAudio null sink for SDL audio, then run under Xvfb (teek
      # wants a display). gemba-backed tests skip gracefully if it can't load.
      - name: Run tests
        run: |
          set -o pipefail
          pulseaudio --start --daemonize --exit-idle-time=-1 2>/dev/null || true
          pactl load-module module-null-sink sink_name=dummy >/dev/null 2>&1 || true
          xvfb-run -a bundle exec rake test 2>&1 | tee test-output.log
        env:
          CI: '1'

      - name: Upload test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-log-ruby${{ matrix.ruby }}
          path: test-output.log
          retention-days: 7
